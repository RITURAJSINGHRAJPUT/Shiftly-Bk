# Render blueprint — one web service serving both the API and the built client.
#
# Checked in so the deployment is reproducible and reviewable, rather than a set
# of fields somebody once typed into a dashboard.
#
# Create the service from this file: Render → New → Blueprint → pick this repo.

services:
  - type: web
    name: shiftly
    runtime: node
    # Free while testing. It sleeps after 15 minutes idle and takes ~50s to wake,
    # and gives no Shell tab — see DEPLOY.md for how to create the first account
    # without one. Change to `starter` before real use; a manager opening Shiftly
    # mid-shift should not wait fifty seconds.
    plan: free
    region: singapore      # closest to Surat of Render's regions
    branch: main

    # `npm install` at the root installs server and client through the existing
    # postinstall, and server/postinstall runs `prisma generate` — the step whose
    # absence failed the previous attempt. Then build the client and apply the
    # schema, so the database is ready before the process starts.
    buildCommand: npm install && npm run build:deploy

    # One process. It serves client/dist itself, so there is no second service
    # and no CORS.
    startCommand: npm start

    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production

      # Generated by Render and never seen by anyone. The API refuses to boot
      # without it rather than falling back to a predictable value.
      - key: JWT_SECRET
        generateValue: true

      # Set by hand in the dashboard — a connection string does not belong in a
      # file that is committed. Use Supabase's *session pooler* string.
      - key: DATABASE_URL
        sync: false

      # Keys for the public staff API, comma separated. Secret, so set in the
      # dashboard. Unset means GET /api/public/staff answers 503 rather than
      # opening up — an unconfigured deploy never publishes the roster.
      - key: PUBLIC_API_KEYS
        sync: false

      # Origins allowed to call that API from a browser, comma separated and
      # matched exactly (apex and www are different origins). Unset means no
      # other website's JavaScript can read it.
      - key: PUBLIC_API_ORIGINS
        sync: false

# RATE_LIMIT_DISABLED is deliberately absent. It exists for local testing, where
# the suites sign in dozens of times per run; on a deployed instance the login
# limiter must be live.
#
# CORS_ORIGIN is also absent: the client is served from this same service, so
# every request is same-origin and there is nothing to permit. It stays absent
# even now that the public API is browser-callable — that endpoint carries its
# own CORS, scoped to its router, so opening the app-wide one would needlessly
# expose every JWT-guarded endpoint to cross-origin reads as well.
